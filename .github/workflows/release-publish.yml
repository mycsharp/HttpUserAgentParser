name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" \
            --pattern "*.nupkg" \
            --dir ./artifacts \
            --repo "$GITHUB_REPOSITORY"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Verify packages
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          from zipfile import ZipFile

          version = os.environ["TAG"].removeprefix("v")
          ids = ["MyCSharp.HttpUserAgentParser" + suffix for suffix in ("", ".AspNetCore", ".MemoryCache")]
          packages = {Path("artifacts", f"{id_}.{version}.nupkg"): id_ for id_ in ids}
          if set(Path("artifacts").glob("*.nupkg")) != packages.keys():
              raise SystemExit(f"Expected the three release packages for version {version}")
          for path, package_id in packages.items():
              with ZipFile(path) as archive:
                  manifests = [name for name in archive.namelist() if "/" not in name and name.endswith(".nuspec")]
                  if len(manifests) != 1:
                      raise SystemExit(f"{path} must contain a single root .nuspec")
                  manifest = ElementTree.fromstring(archive.read(manifests[0]))
              identity = (manifest.findtext("{*}metadata/{*}id"), manifest.findtext("{*}metadata/{*}version"))
              if identity != (package_id, version):
                  raise SystemExit(f"{path} declares {identity}, expected {(package_id, version)}")

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "Publishing $package to NuGet.org..."
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          echo "All packages published successfully!"

      - name: Upload published packages as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: published-nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 90
