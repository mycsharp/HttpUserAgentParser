name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" \
            --pattern "*.nupkg" \
            --dir ./artifacts \
            --repo "$GITHUB_REPOSITORY"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Verify packages
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          packages=(./artifacts/*.nupkg)
          [[ ${#packages[@]} -eq 3 ]]
          for id in MyCSharp.HttpUserAgentParser{,.AspNetCore,.MemoryCache}; do
            test -f "./artifacts/$id.${TAG#v}.nupkg"
          done

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "Publishing $package to NuGet.org..."
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          echo "All packages published successfully!"

      - name: Upload published packages as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: published-nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 90
