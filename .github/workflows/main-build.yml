name: Main Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Pack
    uses: ./.github/workflows/build-and-test.yml
    with:
      create-pack: true

  create-draft-release:
    name: Create Draft Release
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency: draft-release-${{ needs.build-and-test.outputs.version }}
    env:
      TAG: v${{ needs.build-and-test.outputs.version }}
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Find release for the package version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .draft')
          if [[ "$draft" == true ]]; then
            state=draft
          elif [[ "$draft" == false ]] || git show-ref --verify --quiet "refs/tags/$TAG"; then
            state=published
          else
            state=new
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        if: steps.release.outputs.state == 'new'
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ needs.build-and-test.outputs.version }}
          tag: ${{ env.TAG }}
          commitish: ${{ github.sha }}
          dry-run: true

      - name: Create versioned draft with its packages
        if: steps.release.outputs.state == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" ./artifacts/*.nupkg --draft --target "$GITHUB_SHA" \
            --title "Version ${TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Refresh packages on a rerun of the same draft
        if: steps.release.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ./artifacts/*.nupkg --clobber
