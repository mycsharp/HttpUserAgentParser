name: PR Validation

on:
  pull_request:
    branches:
      - main
    # ready_for_review: validate a draft as soon as it is marked as ready
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Test on .NET 8 through 11
    # Draft pull requests are not validated
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/build-and-test.yml
    with:
      upload-test-results: true
