name: Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        type: string
        default: 'Release'
      upload-test-results:
        description: 'Whether to upload test results as artifacts'
        required: false
        type: boolean
        default: false
      create-pack:
        description: 'Whether to pack NuGet packages'
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: 'The calculated version from NBGV'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.SemVer2 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          global-json-file: ./global.json

      - name: Calculate Version with NBGV
        uses: dotnet/nbgv@master
        id: nbgv
        with:
          setAllVars: true

      - name: Version Info
        run: |
          echo "Calculated version: ${{ steps.nbgv.outputs.SemVer2 }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ inputs.configuration }} --no-restore /p:Version=${{ steps.nbgv.outputs.SemVer2 }}

      - name: Test
        run: dotnet test --configuration ${{ inputs.configuration }} --no-build --verbosity normal --logger "trx;LogFilePrefix=test-results"

      - name: Upload test results
        if: always() && inputs.upload-test-results
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'

      - name: Pack NuGet packages
        if: inputs.create-pack
        run: dotnet pack --configuration ${{ inputs.configuration }} --no-build --output ./artifacts /p:PackageVersion=${{ steps.nbgv.outputs.SemVer2 }}

      - name: Upload NuGet packages
        if: inputs.create-pack
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 30

  native-aot:
    name: Native AOT (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0, net11.0]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          global-json-file: ./global.json

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The libraries are rooted completely: every trimming or AOT warning fails the publish.
      - name: Publish smoke test with Native AOT
        run: dotnet publish tests/HttpUserAgentParser.NativeAot.Smoke --configuration Release --framework ${{ matrix.framework }} --runtime linux-x64 --output ./artifacts/aot

      - name: Run smoke test
        run: ./artifacts/aot/MyCSharp.HttpUserAgentParser.NativeAot.Smoke
