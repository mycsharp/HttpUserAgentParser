# Release Drafter Configuration
# Documentation: https://github.com/release-drafter/release-drafter

name-template: 'Version $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Categories for organizing release notes
categories:
  - title: '🚀 Features'
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'bug'
        - 'fix'
  - title: '🔧 Maintenance'
    when:
      labels:
        - 'maintenance'
        - 'chore'
        - 'refactor'
        - 'dependencies'
  - title: '📚 Documentation'
    when:
      labels:
        - 'documentation'
        - 'docs'
  - title: '⚡ Performance'
    when:
      labels:
        - 'performance'
  - title: '🔒 Security'
    when:
      labels:
        - 'security'
  - type: pre-exclude
    when:
      labels: ['skip-changelog', 'wip']

# Change template (how each PR is listed)
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # Escape special markdown characters

# Template for the release body
template: |
  ## What's Changed

  $CHANGES

  ## 📦 NuGet Packages

  The following packages are included in this release:

  - `MyCSharp.HttpUserAgentParser`
  - `MyCSharp.HttpUserAgentParser.AspNetCore`
  - `MyCSharp.HttpUserAgentParser.MemoryCache`

  ### Installation

  ```bash
  dotnet add package MyCSharp.HttpUserAgentParser
  dotnet add package MyCSharp.HttpUserAgentParser.AspNetCore
  dotnet add package MyCSharp.HttpUserAgentParser.MemoryCache
  ```

  ## Contributors

  $CONTRIBUTORS

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

# Automatically label PRs based on modified files
autolabeler:
  - labels: ['documentation']
    files:
      - '*.md'
      - 'docs/**/*'
  - labels: ['bug']
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - labels: ['feature']
    branch:
      - '/feature\/.+/'
    title:
      - '/feature/i'
  - labels: ['dependencies']
    files:
      - '**/packages.lock.json'
      - '**/*.csproj'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
  - labels: ['github-actions']
    files:
      - '.github/workflows/**/*'
  - labels: ['tests']
    files:
      - 'tests/**/*'
      - '**/*Tests.cs'
      - '**/*Test.cs'
  - labels: ['performance']
    files:
      - 'perf/**/*'
      - '**/*Benchmark*.cs'
