<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Library comparison on .NET 11</title>
<desc id="d">Linear column charts of mean time per call. Single parse with setup: MyCSharp 258 ns and 101 ns, UAParser 10.0 ms and 9.32 ms, DeviceDetector.NET 6.20 ms and 7.76 ms, for Chrome on Windows and APIs-Google. Repeated parse with reused state: MyCSharp result cache hit 19.2 ns and 13.0 ns, UAParser reused compiled parser 124 µs and 107 µs.</desc>
