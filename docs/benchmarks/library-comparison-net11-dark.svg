<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Library comparison on .NET 11</title>
<desc id="d">Linear column charts of mean time per call. Single parse with setup: MyCSharp 246 ns and 104 ns, UAParser 9.41 ms and 9.34 ms, DeviceDetector.NET 5.70 ms and 7.33 ms, for Chrome on Windows and APIs-Google. Repeated parse with reused state: MyCSharp result cache hit 19.4 ns and 12.7 ns, UAParser reused compiled parser 124 µs and 110 µs.</desc>
